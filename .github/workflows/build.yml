name: Build Apple Remote Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Install ESP32 core and libraries
        run: |
          ./bin/arduino-cli config init
          ./bin/arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          ./bin/arduino-cli core install esp32:esp32@3.3.8 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          ./bin/arduino-cli lib install "HomeSpan@2.1.8"
          ./bin/arduino-cli lib install "NimBLE-Arduino@2.5.0"

      - name: Enable Mute in HomeSpan TelevisionSpeaker
        run: |
          python3 -c 'from pathlib import Path; p=Path.home()/"Arduino/libraries/HomeSpan/src/Span.h"; s=p.read_text(); s=s.replace("    REQ(VolumeSelector);      \\n    OPT(ConfiguredName);","    REQ(VolumeSelector);\\n    OPT(Mute);\\n    OPT(ConfiguredName);"); p.write_text(s)'

      - name: Compile ESP32-C3
        run: |
          mkdir -p build artifacts
          ./bin/arduino-cli compile \
            --fqbn "esp32:esp32:esp32c3:PartitionScheme=min_spiffs,CDCOnBoot=cdc" \
            --output-dir build \
            apple_remote_bridge

          echo "Build output:"
          find build -maxdepth 1 -type f -printf '%f\n' | sort

          MERGED=$(find build -maxdepth 1 -type f -name '*.merged.bin' | head -n1)
          if [ -z "$MERGED" ]; then
            echo "No merged bin found"
            exit 1
          fi

          cp "$MERGED" artifacts/honor-x1-apple-remote-bridge.factory.bin
          cp build/*.bin artifacts/ || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: honor-x1-apple-remote-bridge
          path: artifacts/
          if-no-files-found: error


      - name: Compile Relay Prototype
        run: |
          mkdir -p relay-build relay-artifacts
          ./bin/arduino-cli compile \
            --fqbn "esp32:esp32:esp32c3:PartitionScheme=min_spiffs,CDCOnBoot=cdc" \
            --output-dir relay-build \
            relay_bridge

          echo "Relay build output:"
          find relay-build -maxdepth 1 -type f -printf '%f\n' | sort

          RELAY_MERGED=$(find relay-build -maxdepth 1 -type f -name '*.merged.bin' | head -n1)
          if [ -z "$RELAY_MERGED" ]; then
            echo "No relay merged bin found"
            exit 1
          fi

          cp "$RELAY_MERGED" relay-artifacts/honor-x1-relay-bridge.factory.bin

          RELAY_APP=$(find relay-build -maxdepth 1 -type f -name '*.ino.bin' | head -n1)
          if [ -z "$RELAY_APP" ]; then
            RELAY_APP=$(find relay-build -maxdepth 1 -type f -name '*.bin' ! -name '*.bootloader.bin' ! -name '*.partitions.bin' ! -name '*.merged.bin' | head -n1)
          fi
          if [ -z "$RELAY_APP" ]; then
            echo "No relay application bin found"
            exit 1
          fi

          cp "$RELAY_APP" relay-artifacts/honor-x1-relay-bridge.update.bin
          cp relay-build/*.bin relay-artifacts/ || true

      - name: Upload relay firmware
        uses: actions/upload-artifact@v4
        with:
          name: honor-x1-relay-bridge
          path: relay-artifacts/
          if-no-files-found: error


      # LuatOS CORE-ESP32C3 "minimal" board uses the ESP32-C3 native USB port.
      # Arduino-ESP32 3.3.8 does not ship a dedicated AirM2M board ID, so use
      # the generic ESP32-C3 target with USB CDC enabled and DIO flash mode.
      - name: Compile LuatOS CORE ESP32C3 USB
        run: |
          mkdir -p luatos-build luatos-artifacts
          ./bin/arduino-cli compile \
            --fqbn "esp32:esp32:esp32c3:PartitionScheme=min_spiffs,CDCOnBoot=cdc,FlashMode=dio" \
            --output-dir luatos-build \
            relay_bridge

          echo "LuatOS CORE ESP32C3 build output:"
          find luatos-build -maxdepth 1 -type f -printf '%f\n' | sort

          LUATOS_MERGED=$(find luatos-build -maxdepth 1 -type f -name '*.merged.bin' | head -n1)
          if [ -z "$LUATOS_MERGED" ]; then
            echo "No LuatOS merged bin found"
            exit 1
          fi

          cp "$LUATOS_MERGED" luatos-artifacts/honor-x1-relay-bridge-luatos-c3-usb.factory.bin

          LUATOS_APP=$(find luatos-build -maxdepth 1 -type f -name '*.ino.bin' | head -n1)
          if [ -z "$LUATOS_APP" ]; then
            LUATOS_APP=$(find luatos-build -maxdepth 1 -type f -name '*.bin' ! -name '*.bootloader.bin' ! -name '*.partitions.bin' ! -name '*.merged.bin' | head -n1)
          fi
          if [ -z "$LUATOS_APP" ]; then
            echo "No LuatOS application bin found"
            exit 1
          fi

          cp "$LUATOS_APP" luatos-artifacts/honor-x1-relay-bridge-luatos-c3-usb.update.bin
          cp luatos-build/*.bin luatos-artifacts/ || true

      - name: Upload LuatOS CORE ESP32C3 USB firmware
        uses: actions/upload-artifact@v4
        with:
          name: honor-x1-relay-bridge-luatos-c3-usb
          path: luatos-artifacts/
          if-no-files-found: error
