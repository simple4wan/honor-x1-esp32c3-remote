name: Build Apple Remote Bridge

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Install ESP32 core and libraries
        run: |
          ./bin/arduino-cli config init
          ./bin/arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          ./bin/arduino-cli core install esp32:esp32@3.3.8 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          ./bin/arduino-cli lib install "HomeSpan@2.1.8"
          ./bin/arduino-cli lib install "NimBLE-Arduino@2.5.0"
          python3 - <<'PY'
          from pathlib import Path
          p = Path.home() / "Arduino/libraries/HomeSpan/src/Span.h"
          s = p.read_text()
          old = """  CREATE_SERV(TelevisionSpeaker,113)
    REQ(VolumeControlType);
    REQ(VolumeSelector);      
    OPT(ConfiguredName);"""
          new = """  CREATE_SERV(TelevisionSpeaker,113)
    REQ(VolumeControlType);
    REQ(VolumeSelector);
    OPT(Mute);
    OPT(ConfiguredName);"""
          if old not in s:
              # Match HomeSpan 2.1.8 including its descriptive comment.
              old = """  CREATE_SERV(TelevisionSpeaker,113)    // Defines a Television Speaker that can be controlled via the Remote Control widget on an iPhone.  Use only as a Linked Service for the <b>Television</b> Service.
    REQ(VolumeControlType);
    REQ(VolumeSelector);      
    OPT(ConfiguredName);"""
              new = """  CREATE_SERV(TelevisionSpeaker,113)    // Defines a Television Speaker that can be controlled via the Remote Control widget on an iPhone.  Use only as a Linked Service for the <b>Television</b> Service.
    REQ(VolumeControlType);
    REQ(VolumeSelector);
    OPT(Mute);
    OPT(ConfiguredName);"""
          if old not in s:
              raise SystemExit("HomeSpan TelevisionSpeaker block not found")
          p.write_text(s.replace(old, new))
          PY

      - name: Compile ESP32-C3
        run: |
          mkdir -p build artifacts
          ./bin/arduino-cli compile             --fqbn "esp32:esp32:esp32c3:PartitionScheme=min_spiffs,CDCOnBoot=cdc"             --output-dir build             apple_remote_bridge

          echo "Build output:"
          find build -maxdepth 1 -type f -printf '%f\n' | sort

          MERGED=$(find build -maxdepth 1 -type f -name '*.merged.bin' | head -n1)
          if [ -z "$MERGED" ]; then
            echo "No merged bin found"
            exit 1
          fi

          cp "$MERGED" artifacts/honor-x1-apple-remote-bridge.factory.bin
          cp build/*.bin artifacts/ || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: honor-x1-apple-remote-bridge
          path: artifacts/
          if-no-files-found: error
