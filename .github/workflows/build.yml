name: Build ESP32-C3 firmware

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main/**"
      - "CMakeLists.txt"
      - "sdkconfig.defaults"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          idf.py --version
          idf.py set-target esp32c3
          idf.py build
          idf.py merge-bin -o honor-x1-sniffer-esp32c3.factory.bin -f raw
          mkdir -p artifacts
          cp build/honor-x1-sniffer-esp32c3.factory.bin artifacts/
          cp build/honor_x1_sniffer.bin artifacts/
          cp build/bootloader/bootloader.bin artifacts/
          cp build/partition_table/partition-table.bin artifacts/
          cp build/flash_args artifacts/ || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: honor-x1-esp32c3-firmware
          path: artifacts/
          if-no-files-found: error
